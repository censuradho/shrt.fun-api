version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: mv_postgres
    restart: always
    environment:
      POSTGRES_USER: mvUser
      POSTGRES_PASSWORD: mbPass
      POSTGRES_DB: mvDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: mv_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - quiet_network

volumes:
  postgres_data:
  redis_data:

networks:
  quiet_network:
    driver: bridge