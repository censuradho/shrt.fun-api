services:
  api:
    build: .
    container_name: mv_api
    restart: always
    ports:
      - "3333:3333"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      - mv_network

  postgres:
    image: postgres:16
    container_name: mv_postgres
    restart: always
    environment:
      POSTGRES_USER: mvUser
      POSTGRES_PASSWORD: mbPass
      POSTGRES_DB: mvDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mv_network

  redis:
    image: redis:latest
    container_name: mv_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - mv_network

volumes:
  postgres_data:
  redis_data:

networks:
  mv_network:
    driver: bridge
